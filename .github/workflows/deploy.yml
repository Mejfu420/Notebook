name: CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: "read"
  id-token: "write"
  packages: "write"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mejfu420/notebook

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm install
      - run: cd apps/backend && npm run test:ci

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}
          tags: type=sha,format=long
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/486703429318/locations/global/workloadIdentityPools/github-pool/providers/github-pool"
          service_account: "github-actions-deployer@project-c35b3362-c904-47c0-bbd.iam.gserviceaccount.com"
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: "red-notes"
          location: "europe-central2"

      - name: Deploy Kubernetes resources (apply kustomize)
        run: kubectl apply -k k8s/

      - name: Update backend image
        run: |
          kubectl set image deployment/backend-deployment -n red-notes backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}
          kubectl rollout status deployment/backend-deployment -n red-notes --timeout=10m

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend-deployment -n red-notes frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}
          kubectl rollout status deployment/frontend-deployment -n red-notes --timeout=10m