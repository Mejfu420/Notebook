name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - run: |
          cd apps/backend
          npm run test:ci

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}
          tags: type=sha,format=long
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      - name: Deploy to Kubernetes
        run: |
          # 1. Wdrożenie konfiguracji za pomocą kustomize
          # Kustomize odczyta wszystkie pliki -deploy.yaml
          kubectl apply -k k8s/

          IMAGE_TAG="sha-${{ github.sha }}"
          NAMESPACE="red-notes"

          # 2. Aktualizacja obrazów (używamy nazw z metadata.name czyli -deployment)
          kubectl set image deployment/frontend-deployment frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${IMAGE_TAG} -n $NAMESPACE
          kubectl set image deployment/backend-deployment backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${IMAGE_TAG} -n $NAMESPACE
          kubectl set image deployment/worker-deployment worker=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/worker:${IMAGE_TAG} -n $NAMESPACE

          # 3. Statusy wdrożenia (oczekiwanie na start kontenerów)
          kubectl rollout status deployment/backend-deployment -n $NAMESPACE --timeout=2m
          kubectl rollout status deployment/frontend-deployment -n $NAMESPACE --timeout=2m
          kubectl rollout status deployment/worker-deployment -n $NAMESPACE --timeout=2m
