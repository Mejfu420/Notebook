name: CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: "read"
  id-token: "write"
  packages: "write"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mejfu420/notebook

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm install
      - run: cd apps/backend && npm run test:ci

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.component }}
          tags: type=sha,format=long
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/486703429318/locations/global/workloadIdentityPools/github-pool/providers/github-pool"
          service_account: "github-actions-deployer@project-c35b3362-c904-47c0-bbd.iam.gserviceaccount.com"
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: "red-notes"
          location: "europe-central2"

      - name: Deploy with Kustomize
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          cd k8s
          
          envsubst < secrets.yaml > secrets.yaml.tmp && mv secrets.yaml.tmp secrets.yaml
          
          kustomize edit set image ghcr.io/mejfu420/notebook/backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:sha-${{ github.sha }}
          kustomize edit set image ghcr.io/mejfu420/notebook/frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:sha-${{ github.sha }}

          kubectl apply -k .

          kubectl rollout status deployment/backend-deployment -n red-notes --timeout=10m
          kubectl rollout status deployment/frontend-deployment -n red-notes --timeout=10m